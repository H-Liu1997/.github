name: 问题
description: 一个研究问题（大问题或子问题）
body:
  - type: textarea
    id: question
    attributes:
      label: 问题
      description: 要回答什么，一两句，用你自己的话
    validations:
      required: true
  - type: input
    id: verifier
    attributes:
      label: verifier
      description: 用什么判断，例：verifier/v3 @ <评测集>；可以先空着，讨论后再填
  - type: input
    id: baseline
    attributes:
      label: baseline
      description: 和谁比，例：v1.0 + 当前推荐用法
